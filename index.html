<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApexOS Linux Distro Studio</title>
    <meta name="description" content="Architect and build custom Ubuntu-based Linux distributions pre-configured with PPA repositories for Claude, ChatGPT, Android Studio, and Lutris." />
    <meta property="og:title" content="ApexOS Linux Distro Studio" />
    <meta property="og:description" content="Architect and build custom Ubuntu-based Linux distributions pre-configured with PPA repositories for Claude, ChatGPT, Android Studio, and Lutris." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script>
      // Suppress dev-environment WebSocket HMR reconnection errors in Cloud Run iframe
      window.addEventListener('error', function(event) {
        if (
          event?.message && (
            event.message.indexOf('WebSocket') !== -1 ||
            event.message.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            event.message.indexOf('@vite/client') !== -1
          )
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event?.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          msg.indexOf('@vite/client') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
