default vesamenu.c32
prompt 0
timeout 100

menu title ApexOS Live Bootloader (Legacy BIOS)
menu background splash.png
menu color title 1;37;44 #ffffffff #00000000 std

label live
  menu label ^Try or Install ApexOS
  kernel /casper/vmlinuz
  append boot=casper initrd=/casper/initrd quiet splash ---

label direct
  menu label ^Install ApexOS Directly
  kernel /casper/vmlinuz
  append boot=casper initrd=/casper/initrd only-ubiquity quiet splash ---

label safe
  menu label ApexOS (^Safe Graphics Mode)
  kernel /casper/vmlinuz
  append boot=casper initrd=/casper/initrd nomodeset quiet splash ---

label memtest
  menu label Run ^Memory Test (Memtest86+)
  kernel /boot/memtest86+.bin
