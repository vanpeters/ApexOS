# Loopback configuration for ISO boot utilities (Ventoy, GRUB loopmount)
menuentry "ApexOS (Boot from Loopback ISO File)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz boot=casper iso-scan/filename=${iso_path} quiet splash fsck.mode=skip ---
    initrd /casper/initrd
}

menuentry "ApexOS (Safe Graphics - Loopback ISO)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz boot=casper iso-scan/filename=${iso_path} nomodeset quiet splash ---
    initrd /casper/initrd
}
