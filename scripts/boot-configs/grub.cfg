# GRUB 2.12 UEFI Bootloader Configuration for ApexOS FAT32 Live USB
set default="0"
set timeout=10

# Graphical console and video modules
insmod font
if loadfont ${prefix}/fonts/unicode.pf2 ; then
    insmod gfxterm
    set gfxmode=auto
    terminal_output gfxterm
fi

insmod all_video
insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2

# Live Desktop Boot Option
menuentry "Try or Install ApexOS (Live Session - FAT32)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz boot=casper quiet splash fsck.mode=skip ---
    initrd /casper/initrd
}

# Direct Automated Installer
menuentry "Install ApexOS Directly (Automated Calamares/Ubiquity)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz boot=casper only-ubiquity quiet splash ---
    initrd /casper/initrd
}

# Safe Graphics Nomodeset Fallback
menuentry "ApexOS (Safe Graphics Mode - Nomodeset)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz boot=casper nomodeset quiet splash ---
    initrd /casper/initrd
}

# Integrity Check
menuentry "Check USB Boot Media Integrity" {
    linux  /casper/vmlinuz boot=casper integrity-check quiet splash ---
    initrd /casper/initrd
}

# UEFI Hardware Setup
menuentry "UEFI Firmware Settings" {
    fwsetup
}

# Power Options
menuentry "Reboot System" {
    reboot
}

menuentry "Shutdown" {
    halt
}
